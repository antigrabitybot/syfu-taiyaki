<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fb6e6" />
    <title>TAIYAKI TOWER</title>
    <script type="module" crossorigin src="./assets/index-DpUBU9oh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DHgiplKz.css">
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="vignette"></div>

    <div id="hud" class="hidden">
      <div id="height"><span id="height-val">0.00</span><small> m</small></div>
      <div id="right">
        <div id="count">0</div>
        <div id="misses"><i></i><i></i><i></i></div>
        <button id="quit" class="hidden">やめる</button>
      </div>
    </div>
    <div id="flash"></div>
    <div id="hint" class="hidden"><div class="finger">👆</div><div>ドラッグで動かす・指を離して落とす<br />↻ で回転</div></div>
    <button id="rotate" class="hidden" aria-label="回転">↻</button>

    <div id="title" class="screen">
      <div class="logo"><div class="syfu">SyFu</div><div class="name">TAIYAKI<br />TOWER</div></div>
      <div id="title-best"></div>
      <div class="modes"><button class="modebtn" id="start">START</button></div>
      <label id="endless-toggle"><input type="checkbox" id="endless" /> エンドレス（ミスしても続く）</label>
      <div class="notice">SyFu 非公式ファンゲーム</div>
    </div>

    <div id="result" class="screen hidden">
      <div id="new-record" class="hidden">NEW RECORD</div>
      <div id="res-height">0.00 m</div>
      <div id="res-count">0 TAIYAKI</div>
      <div id="res-best"></div>
      <button id="again">AGAIN</button>
      <button id="share" class="sub">シェア</button>
      <div class="notice">SyFu 非公式ファンゲーム</div>
    </div>

    <button id="mute" aria-label="ミュート切替">🔊</button>
    <div id="debug" class="hidden"></div>
  </body>
</html>
